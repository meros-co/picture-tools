[package]
name = "meros-picture-tools"
version = "0.1.0"
description = "Picture tools for video apps: 3D LUTs, false color, zebras, focus peaking and scopes, with one shader generated for Flutter, GLES 3, Metal and WebGL 1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "meros_picture_tools"
# rlib for Rust apps; staticlib and cdylib for apps that use the C ABI.
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
# The C ABI (include/meros_picture_tools.h).
capi = ["dep:serde_json"]
# The shader generator's code (used by picture-tools-gen).
codegen = ["dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
