# include/meros_picture_tools.h, from the `capi` feature:
#   scripts/gen-header.sh
language = "C"
include_guard = "MEROS_PICTURE_TOOLS_H"
autogen_warning = "/* Generated by cbindgen from crates/picture-tools/src/capi.rs. Don't edit; regenerate. */"
documentation = true
documentation_style = "c99"
usize_is_size_t = true
cpp_compat = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[export]
item_types = ["functions", "opaque", "constants"]
include = ["MptLut"]
exclude = ["MAX_BANDS", "MAX_ZEBRAS", "MAX_SIZE", "MAX_FROM_1D", "Intensity", "LumaWeights", "ScopeKind", "Range", "ScopeOptions", "Shape"]

[defines]
"feature = capi" = "MPT_CAPI_ALWAYS"
