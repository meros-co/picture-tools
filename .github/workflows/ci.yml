name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Includes the shader check in headless Chrome, which the runners have,
      # and the check that the generated files are current.
      - name: Test
        run: cargo test --workspace --all-features

  msrv:
    name: Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p meros-picture-tools --all-features
      - run: cargo test -p meros-picture-tools --lib

  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p meros-picture-tools --lib --target wasm32-unknown-unknown

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  header:
    name: C header current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cbindgen --locked
      - run: sh scripts/gen-header.sh --verify

  flutter:
    name: Flutter package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The goldens are drawn by this release; a newer one may draw
          # them a pixel differently.
          flutter-version: 3.44.4
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  swift:
    name: Swift package (Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate for the test bundle
        run: cargo build -p meros-picture-tools --features capi --release
      - name: Test
        working-directory: swift
        run: swift test -Xlinker -L../target/release -Xlinker -lmeros_picture_tools
